name: Update Quiz Manifest

# Jalan otomatis tiap kali ada file .html yang di-push ke branch main
# (kecuali index.html sendiri), atau bisa dipicu manual dari tab Actions.
on:
  push:
    branches: [ main ]
    paths:
      - '**.html'
      - '!index.html'
  workflow_dispatch:

# Wajib "write" supaya Actions boleh commit manifest.js kembali ke repo.
# Cek: Settings > Actions > General > Workflow permissions >
# "Read and write permissions" harus dicentang.
permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Jalankan generate_manifest.py
        run: python generate_manifest.py

      - name: Commit manifest.js jika berubah
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.js
          git diff --staged --quiet || git commit -m "chore: auto-update manifest.js [skip ci]"
          git push
